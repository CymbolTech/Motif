services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motif_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-motif}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Go.Dockerfile
      args:
        APP: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-motif}:${POSTGRES_PASSWORD:-motif_local_only}@postgres:5432/${POSTGRES_DB:-motif}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/Go.Dockerfile
      args:
        APP: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-motif}:${POSTGRES_PASSWORD:-motif_local_only}@postgres:5432/${POSTGRES_DB:-motif}?sslmode=disable
      MOTIF_RUNTIME_ENV: ${MOTIF_RUNTIME_ENV:-development}
      NATS_URL: nats://nats:4222
      API_ADDR: 0.0.0.0:8080
      MOTIF_BOOTSTRAP_API_KEY: ${MOTIF_BOOTSTRAP_API_KEY:-dev_only_change_me}
      MOTIF_BOOTSTRAP_TENANT: ${MOTIF_BOOTSTRAP_TENANT:-demo-tenant}
      MOTIF_BOOTSTRAP_ENVIRONMENT: ${MOTIF_BOOTSTRAP_ENVIRONMENT:-sandbox}
      MOTIF_ADMIN_API_KEY: ${MOTIF_ADMIN_API_KEY:-admin_dev_only_change_me}
      MOTIF_ADMIN_EMAIL: ${MOTIF_ADMIN_EMAIL:-admin@motif.local}
      MOTIF_ADMIN_PASSWORD: ${MOTIF_ADMIN_PASSWORD:-admin_dev_only_change_me}
      MOTIF_CORS_ORIGINS: ${MOTIF_CORS_ORIGINS:-http://127.0.0.1:4173}
      MOTIF_RATE_LIMIT_RPS: ${MOTIF_RATE_LIMIT_RPS:-30}
      MOTIF_RATE_LIMIT_BURST: ${MOTIF_RATE_LIMIT_BURST:-60}
      MOTIF_METRICS_ENABLED: ${MOTIF_METRICS_ENABLED:-true}
      MOTIF_REWARD_PROVIDER: ${MOTIF_REWARD_PROVIDER:-mock}
      MOTIF_REWARD_PROVIDER_URL: ${MOTIF_REWARD_PROVIDER_URL:-}
      MOTIF_REWARD_PROVIDER_STATUS_URL: ${MOTIF_REWARD_PROVIDER_STATUS_URL:-}
      MOTIF_REWARD_PROVIDER_TOKEN: ${MOTIF_REWARD_PROVIDER_TOKEN:-}
      MOTIF_REWARD_PROVIDER_ENCRYPTION_KEY: ${MOTIF_REWARD_PROVIDER_ENCRYPTION_KEY:-}
      MOTIF_REWARD_PROVIDER_TIMEOUT_SECONDS: ${MOTIF_REWARD_PROVIDER_TIMEOUT_SECONDS:-8}
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Go.Dockerfile
      args:
        APP: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-motif}:${POSTGRES_PASSWORD:-motif_local_only}@postgres:5432/${POSTGRES_DB:-motif}?sslmode=disable
      MOTIF_RUNTIME_ENV: ${MOTIF_RUNTIME_ENV:-development}
      MOTIF_BOOTSTRAP_API_KEY: ${MOTIF_BOOTSTRAP_API_KEY:-dev_only_change_me}
      MOTIF_ADMIN_API_KEY: ${MOTIF_ADMIN_API_KEY:-admin_dev_only_change_me}
      MOTIF_ADMIN_PASSWORD: ${MOTIF_ADMIN_PASSWORD:-admin_dev_only_change_me}
      MOTIF_CORS_ORIGINS: ${MOTIF_CORS_ORIGINS:-http://127.0.0.1:4173}
      NATS_URL: nats://nats:4222
      WORKER_HEALTH_ADDR: 0.0.0.0:8081
      MOTIF_REWARD_PROVIDER: ${MOTIF_REWARD_PROVIDER:-mock}
      MOTIF_REWARD_PROVIDER_URL: ${MOTIF_REWARD_PROVIDER_URL:-}
      MOTIF_REWARD_PROVIDER_STATUS_URL: ${MOTIF_REWARD_PROVIDER_STATUS_URL:-}
      MOTIF_REWARD_PROVIDER_TOKEN: ${MOTIF_REWARD_PROVIDER_TOKEN:-}
      MOTIF_REWARD_PROVIDER_ENCRYPTION_KEY: ${MOTIF_REWARD_PROVIDER_ENCRYPTION_KEY:-}
      MOTIF_REWARD_PROVIDER_TIMEOUT_SECONDS: ${MOTIF_REWARD_PROVIDER_TIMEOUT_SECONDS:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORKER_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  default:
    name: motifengine_default
    ipam:
      config:
        - subnet: 10.254.0.0/24

volumes:
  postgres_data:
  nats_data:
