        tenant_id: { type: string }
        environment_id: { type: string }
        level: { type: integer, minimum: 1 }
        name: { type: string }
        xp_threshold: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
    Level:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        environment_id: { type: string }
        level: { type: integer }
        name: { type: string }
        xp_threshold: { type: integer, format: int64 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Redemptions:
